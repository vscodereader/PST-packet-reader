[package]
name = "pstmacro"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
# 토론방 CLI(naver_discussion_cli) 바이너리가 추가되며 바이너리가 둘이 되었다.
# `tauri dev`(= cargo run)가 앱 본체를 실행하도록 기본 바이너리를 지정한다.
default-run = "pstmacro"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pstmacro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = "12"
serde_urlencoded = "0.7"
urlencoding = "2"
tokio = { version = "1", features = ["full"] }
thiserror = "1"
# rustls-tls(순수 Rust TLS)로 Windows 크로스 컴파일 시 openssl 시스템 의존을 피한다.
# gzip 은 #67 가입 카페 목록 응답 해제용, blocking 은 패킷 게시 엔진용.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "gzip"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
# 로그 타임스탬프를 사람이 읽기 쉬운 로컬 시각으로 출력하기 위함(표현 전용).
chrono = { version = "0.4", default-features = false, features = ["clock"] }
open = "5"
# 네이버 증권 토론방 패킷 게시 엔진(naver_automation/discussion_batch)에서 사용
tungstenite = "0.21"
url = "2"
# 엑셀(.xlsx) 입출력
rust_xlsxwriter = "0.79"
calamine = "0.35"
# 네이티브 파일 다이얼로그
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
# 단일 인스턴스 가드 — 이미 트레이로 상주 중이면 두 번째 실행을 막고 기존 창을 띄운다.
tauri-plugin-single-instance = "2"
# 데스크톱(OS) 토스트 — 트레이 상주 중 게시 완료·놓침 능동 통지(#163)
tauri-plugin-notification = "2"
# band.us api `md` 서명(HMAC-SHA256 → base64). band-web `BandWebAuthModule.makeMd` 미러.
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
# Enables `tauri::test` (MockRuntime) for the IPC integration tests in `tests/`.
tauri = { version = "2", features = ["test"] }
