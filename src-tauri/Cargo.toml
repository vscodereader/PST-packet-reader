[package]
name = "pstmacro"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
# 토론방 CLI(naver_discussion_cli) 바이너리가 추가되며 바이너리가 둘이 되었다.
# `tauri dev`(= cargo run)가 앱 본체를 실행하도록 기본 바이너리를 지정한다.
default-run = "pstmacro"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pstmacro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = "12"
tokio = { version = "1", features = ["full"] }
thiserror = "1"
adb_client = { version = "3.2.1", features = ["usb"] }
open = "5"
# 네이버 증권 토론방 패킷 게시 엔진(naver_automation/discussion_batch)에서 사용
tungstenite = "0.21"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
# 엑셀(.xlsx) 입출력
rust_xlsxwriter = "0.79"
calamine = "0.26"
# 네이티브 파일 다이얼로그
tauri-plugin-dialog = "2"

[dev-dependencies]
tempfile = "3"
# Enables `tauri::test` (MockRuntime) for the IPC integration tests in `tests/`.
tauri = { version = "2", features = ["test"] }
