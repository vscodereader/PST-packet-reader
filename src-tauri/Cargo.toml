[package]
name = "pstmacro"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
# 토론방 CLI(naver_discussion_cli) 바이너리가 추가되며 바이너리가 둘이 되었다.
# `tauri dev`(= cargo run)가 앱 본체를 실행하도록 기본 바이너리를 지정한다.
default-run = "pstmacro"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pstmacro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = "12"
serde_urlencoded = "0.7"
tokio = { version = "1", features = ["full"] }
thiserror = "1"
adb_client = { version = "3.2.1", features = ["usb"] }
# rustls-tls(순수 Rust TLS)로 Windows 크로스 컴파일 시 openssl 시스템 의존을 피한다.
# gzip 은 #67 가입 카페 목록 응답 해제용, blocking 은 패킷 게시 엔진용.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "gzip"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
open = "5"
# 네이버 증권 토론방 패킷 게시 엔진(naver_automation/discussion_batch)에서 사용
tungstenite = "0.21"
url = "2"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
# Enables `tauri::test` (MockRuntime) for the IPC integration tests in `tests/`.
tauri = { version = "2", features = ["test"] }
