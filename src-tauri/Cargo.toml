[package]
name = "pstmacro"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pstmacro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = "12"
tokio = { version = "1", features = ["full"] }
thiserror = "1"
adb_client = { version = "3.2.1", features = ["usb"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"   # optimize for size; perf cost negligible for a Tauri UI shell
lto = true        # link-time optimization across crate boundaries
codegen-units = 1 # better optimization at the cost of slower release builds
strip = true      # strip debug symbols from the final binary
panic = "abort"   # drop unwinding tables — smaller binary, faster panics
