name: CI

on:
  push:
    branches: [master, main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
      - ".editorconfig"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
      - ".editorconfig"

# Cancel superseded runs on the same PR (a new push obsoletes the old run).
# Pushes to master are never cancelled, so each landed commit keeps its run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm lint:css
      - run: pnpm typecheck
      # `test:coverage` already runs the full suite under coverage — running
      # `pnpm test` again would just re-run the same tests.
      - run: pnpm test:coverage

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Runs the test suite (unit + IPC integration) under llvm instrumentation
      # and fails the build if coverage regresses below the gate (lines 83% /
      # functions 82%).
      #
      # The gate measures unit-testable logic. Browser (CDP), network (packet),
      # and process-launch I/O — the naver_automation engine, packet_client,
      # discussion_batch, the CDP login flow (auth/chrome|login|login_flow),
      # adb, the CLI bin, and the Tauri bootstrap glue in lib.rs/main.rs — are
      # verified by manual/integration runs, not unit tests, so they are
      # excluded from the denominator. Add their tests on their own PRs.
      - name: Rust tests + coverage gate
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info --ignore-filename-regex '(/main\.rs|/lib\.rs|/bin/|/discussion_batch\.rs|/naver_automation\.rs|/naver_automation/(browser_flow|devtools_connection|discussion_room|post_form|packet_client)\.rs|/auth/(chrome|login|login_flow|adb)\.rs)' --fail-under-lines 83 --fail-under-functions 82
      - name: Coverage summary
        run: cargo llvm-cov report --ignore-filename-regex '(/main\.rs|/lib\.rs|/bin/|/discussion_batch\.rs|/naver_automation\.rs|/naver_automation/(browser_flow|devtools_connection|discussion_room|post_form|packet_client)\.rs|/auth/(chrome|login|login_flow|adb)\.rs)'
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-coverage-lcov
          path: src-tauri/lcov.info
