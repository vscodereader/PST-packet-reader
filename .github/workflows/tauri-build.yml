name: Tauri build

on:
  # Multi-OS Tauri build is expensive (3 OSes, ~12 min each), so it no longer
  # runs on every PR push. It validates each commit that lands on the default
  # branch, plus on demand via the Actions "Run workflow" button when a branch
  # needs pre-merge cross-platform validation. Docs-only changes skip.
  push:
    branches: [master, main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
      - ".editorconfig"
  workflow_dispatch:

# Don't cancel in-flight builds — each landed commit (or manual run) keeps its
# own cross-platform result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf

      - run: pnpm install --frozen-lockfile

      - run: pnpm tauri build
